desc: 买下房子后，松达被派往阿卡莱开拓。帮他从零建起『一始村』：陆续提供木材、找来鼓隆人格雷达、格鲁德人朗洁、利特人费松，再请卓拉人卡森主持他与朗洁的婚礼。
note: 超长连锁任务，要反复回一始村交木材（10/20/30/50捆）并去鼓隆、格鲁德、利特、卓拉各村招人。
reward: 钻石×3（并建成一始村）
steps:
- 在阿卡莱湖孤岛与松达对话，提供10捆木材
- 去南部矿山请鼓隆人格雷达兄弟来帮忙，再供20捆木材
- 去卡拉卡拉集市请格鲁德人朗洁来，再供30捆木材
- 去利特村请费松来开店，再供50捆木材
- 去卓拉领地请卡森主持婚礼，并回哈特诺请樱达来参加
- 婚礼结束后向松达复命
