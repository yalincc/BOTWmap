desc: 在捕鱼村与老渔夫罗泽尔对话，他说起“金色三角中央沉睡着宝物”。前往内库达海指定海域，用磁力抓取器从海底捞起宝箱。
note: 宝箱沉在内库达海海床上，需下潜到“金色三角”海域用磁力抓取器吸起；注意潜水体力，可在水面用磁力把箱子拉近再开，别在水底憋太久。
reward: 蓝宝石×1、黄玉×2、雷电剑×1
steps:
- 在捕鱼村与罗泽尔对话接取任务
- 前往他所说的海域，潜入水中用磁力抓取器吸住海底宝箱
- 依次拉起全部4个沉底宝箱并开启
