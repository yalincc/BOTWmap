desc: 在格鲁德小镇与玲奈尔对话。她的姐妹芭乐塔去格鲁德沙漠找『冰凉的东西』后失踪。去北格鲁德高地/南洛美方向的冰谷（冷西卡研究所附近）找到被冻住、躲起来的芭乐塔。
