desc: 在森林驿站与莎玛伊对话，她想坐热气球升空看风景。把木柴放到驿站旁的热气球装置上点燃，随气球升空。
note: 把木柴放上平台后必须点燃（火剑射箭/打火石），气球才会带板升起；升到足够高度任务即完成，不用怕摔落。
reward: 星星碎片
steps:
- 在森林驿站与莎玛伊对话接取
- 把木柴放到热气球装置上
- 用火点燃木柴使气球膨胀升起
- 随气球升到高处后落地
- 回报莎玛伊
