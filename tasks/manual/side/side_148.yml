desc: 与《异度神剑2》的免费版本联动（Version 1.3.3 更新实装）。离开初始台地后读取大地图自动激活：在海拉鲁各地夜空寻找 3 颗红色流星，流星坠落处的宝箱即为打捞员三件套。（来源：https://zeldawiki.wiki/wiki/Xenoblade_Chronicles_2 ）
note: 三件套宝箱为 _Collabo 类型联动宝箱（共 3 点，见探索面板「DLC 宝箱」层），本条任务 pts 不另上图。三颗流星方位：①海拉鲁大桥正中间往南看；②骷髅湖左眼往东看；③海布拉山顶往西南看；夜间抬头看天，红色流星坠落后宝箱每晚发红光柱。官方简中完成文案见 QL_bf2_collabo.msbt.json（3 颗红色流星全部找到/打捞员/3 件装备）。（来源：https://zeldawiki.wiki/wiki/Xenoblade_Chronicles_2 ；romfs/msbt-zh/QuestMsg/QL_bf2_collabo.msbt.json ）
reward: 打捞员头盔 + 打捞员外衣 + 打捞员裤子（Salvager 套装）
steps:
- 离开初始台地后读取大地图，任务自动激活
- 夜间在海拉鲁大桥中段往南看天空，找到第 1 颗红色流星
- 夜间在骷髅湖左眼往东看天空，找到第 2 颗红色流星
- 夜间在海布拉山顶往西南看天空，找到第 3 颗红色流星
- 打开 3 个流星坠落宝箱，集齐打捞员三件套
