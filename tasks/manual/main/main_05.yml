desc: 在卡卡利科村听英帕讲完一百年前的历史后接取。林克需前往四个种族的领地，解放被盖侬侵占的四头神兽，以削弱灾厄盖侬。
note: 四头神兽顺序完全自由，但建议先卓拉（拿卓拉铠甲能攀瀑布，后面跑图效率大增）；任意一头不打都行，只是最终盖侬会多 1/8 血。
reward: ''
steps:
- 与英帕对话，希卡之石地图上标出四神兽位置
- 按任意顺序前往鼓隆、利特、卓拉、格鲁德四族领地
- 分别入侵并解放四头神兽，击败内部的盖侬残影
- 回到卡卡利科村向英帕汇报，任务完成
