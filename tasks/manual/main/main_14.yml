desc: DLC 英杰诗篇之一。在奥尔汀地区的石碑前接取。完成三处古代神庙集齐三颗鲁达尼亚徽章后，进入神兽瓦·鲁达尼亚的记忆幻境，再战火灾盖侬。通关后达尔克尔的力量升级为「达尔克尔的守护+」。
note: 记忆幻境里强制穿耐火铠甲、持碎石剑，不能换自己的装备；火灾盖侬二阶段会满地岩浆，记得用冰箭减速，别在岩浆里硬拼。
reward: 达尔克尔的守护+（冷却时间缩短至 6 分钟）
steps:
- 在奥尔汀地区的石碑前与 Kass 对话，接下试炼
- 完成三处古代神庙，集齐三颗鲁达尼亚徽章
- 进入神兽瓦·鲁达尼亚的记忆幻境，使用耐火装备再战火灾盖侬
- 击败后听 Kass 弹唱英杰达尔克尔之歌，获得强化技能
