desc: 在拉聂尔地区的伊诺戈桥上，卓拉族王子希多向林克求助——神兽瓦·露塔不停降雨，卓拉领地危在旦夕。林克随他进入卓拉领地，见到多莱凡国王，获赠米法生前缝制的卓拉铠甲，并去收集 20 支电击箭以开启神兽。
note: 去卓拉领地路上全是电击敌人，出发前嗑电抗药；帕雷德山上蹲着一只莱尼尔（人马），别正面刚，远远躲着捡地上插着的 20 支电击箭就够，硬打容易被一箭秒。
reward: 卓拉铠甲（Zora Armor）
steps:
- 在伊诺戈桥上与希多王子相遇，随他前往卓拉领地
- 登上王座晋见多莱凡国王，获赠卓拉铠甲
- 装备卓拉铠甲攀上瀑布，在帕雷德山上收集 20 支电击箭
- 与希多一起乘瀑布上升，用慢动作射击瓦·露塔身上的粉色宝珠，开启神兽
