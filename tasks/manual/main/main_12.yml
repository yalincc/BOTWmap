desc: DLC《英杰们的诗篇》开篇。把希卡之石送复苏神庙的终端后，出现一击必杀的「一击之剑」。林克要带着它在初始台地清掉四个怪物营地、通关四座新神庙，随后完成四位英杰的试炼，最终击败导师玛兹·科西亚。
note: 拿起「一击之剑」后林克只剩 1/4 颗心，被怪摸一下就死，但反过来一剑能秒怪；想中途放弃试炼只要离开初始台地，剑会自动回到复苏神庙。
reward: 摩托·零式（Master Cycle Zero）
steps:
- 回到复苏神庙把希卡之石放回终端，取得一击之剑
- 持一击之剑清掉初始台地上四个怪物营地，通关四座新出现的神庙
- 依次完成乌尔波扎、达尔克尔、米法、力巴尔四首英杰之歌（EX 任务）
- 进入最终试炼，击败导师玛兹·科西亚
