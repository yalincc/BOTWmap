desc: DLC 英杰诗篇之一。在东格鲁德高原的石碑前接取。完成三处古代神庙试炼拿到三颗纳波利斯徽章后，进入神兽瓦·娜波利斯内部的记忆幻境，再战风暴盖侬。通关后乌尔波扎的力量升级为「乌尔波扎的愤怒+」。
note: 记忆幻境里装备是系统固定发的（七宝匕首、双刃锤等），自己包里的装备和食材带不进去，死了就要从石碑重新开始，建议提前在外面把血补满。
reward: 乌尔波扎的愤怒+（冷却时间缩短）
steps:
- 在东格鲁德高原的石碑前与 Kass 对话，接下试炼
- 完成三处古代神庙，集齐三颗娜波利斯徽章
- 进入神兽瓦·娜波利斯的记忆幻境，使用固定装备再战风暴盖侬
- 击败后听 Kass 弹唱英杰乌尔波扎之歌，获得强化技能
