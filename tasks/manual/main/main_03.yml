desc: 老人现出真身——海拉鲁国王洛阿姆的灵魂，嘱托林克前往海拉鲁城堡打倒灾厄盖侬、救出塞尔达。这是贯穿全程的最终目标任务，可随时触发最终决战。
note: 可以不解放四神兽直接冲城堡打盖侬，但开局要连战风/水/火/雷四个盖侬残影，难度极高；每解放一头神兽，最终战它会帮你削掉盖侬 1/8 血，强烈建议先清四神兽再通关。
reward: 通关结局（封印灾厄盖侬，救出塞尔达）
steps:
- 从初始台地出发，前往海拉鲁城堡潜入
- 在教堂击败灾厄盖侬第一形态（若未解放四神兽，需先连战 four 盖侬残影）
- 被传送到平原，以光之弓射击暗黑灾厄盖侬身上的发光弱点
- 击落核心后由塞尔达施展封印，通关结局
