desc: 鼓隆城老大布尔多腰痛发作，无法去讨伐神兽瓦·鲁达尼亚。一路找到阿陨，
  在他的达尔克尔守护帮助下用大炮把神兽赶入火山口，进入体内击败火咒盖侬。
note: |
  1. 先去鼓隆城找布尔多，他会提到阿陨失踪。
  2. 到废弃的北部矿坑，先找多立疆问线索，再深入保管库救出阿陨。
  3. 奥尔汀桥前救下被怪物围攻的阿陨。
  4. 用阿陨的达尔克尔守护变成炮弹，把神兽炸进死亡之山。
  5. 避开神兽放出的侦查机，引导阿陨靠近；体内打火咒盖侬。
reward: 达尔克尔的守护（英杰技能·格挡反击）
steps:
  - 在鼓隆城与布尔多对话，接取讨伐神兽的任务
  - 前往废弃的北部矿坑，找多立疆打听阿陨下落
  - 深入矿坑保管库，救出阿陨
  - 在奥尔汀桥前救下受袭的阿陨，带着他前往死亡之山
  - 借助达尔克尔的守护变成炮弹，把神兽赶入火山口
  - 避开侦查机，引导阿陨接近神兽并潜入
  - 击败火咒盖侬，镇压神兽瓦·鲁达尼亚
  - 返回鼓隆城向布尔多报告，获得达尔克尔的守护
