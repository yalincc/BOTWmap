desc: 利特村族长卡昂请你协助战士特巴。先在飞行训练场完成特巴的试炼，
  再与他配合在空中摧毁神兽瓦·梅德的炮台、登上其背，击败风咒盖侬。
note: |
  1. 到利特村找卡昂接取，先向特巴的妻子莎琪打听特巴行踪。
  2. 飞行训练场：在上升气流中展开滑翔帆，打完全部靶子才能过关。
  3. 空战阶段用炸弹箭摧毁 4 个炮台，注意躲避神兽的激光。
  4. 登上神兽后背进入体内，打风咒盖侬（多用滑翔/上升气流）。
reward: 力巴尔的猛攻（英杰技能·原地起跳滑翔）
steps:
  - 在利特村与卡昂对话，接取协助特巴的任务
  - 向莎琪打听，得知特巴去了飞行训练场
  - 在飞行训练场完成击靶试炼，获得特巴认可
  - 与特巴配合升空，用炸弹箭摧毁神兽瓦·梅德的炮台
  - 登上神兽后背，进入体内
  - 击败风咒盖侬，镇压神兽瓦·梅德
  - 返回利特村向卡昂报告，获得力巴尔的猛攻
