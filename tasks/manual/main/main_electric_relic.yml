desc: 格鲁德族族长璐菊请你帮忙镇压神兽瓦·娜波力斯。先在兵营打听盗贼线索，
  潜入依盖队基地夺回格鲁德族神器，再与璐菊用沙海象配合击毁神兽四足。
note: |
  1. 到格鲁德小镇找璐菊接取，向兵营队长琪珂打听盗贼基地。
  2. 依盖队基地人头攒动，正面硬拼不利，**潜入**取回神器。
  3. 归还神器后先熟悉沙海象操作，再与神兽交战。
  4. 战斗中用炸弹箭击穿神兽 4 只脚；待在璐菊身边可让落雷失去威力。
  5. 进入体内打雷咒盖侬（注意避雷与铁制装备）。
reward: 乌尔波扎的愤怒（英杰技能·范围落雷）
steps:
  - 在格鲁德小镇与璐菊对话，接取镇压神兽的任务
  - 向兵营队长琪珂打听，锁定盗贼基地位置
  - 潜入依盖队基地，从盗贼头目手中夺回格鲁德族神器
  - 把神器还给璐菊，并熟悉沙海象的操纵
  - 与神兽瓦·娜波力斯交战，用炸弹箭击穿其 4 只脚
  - 登上神兽，进入体内击败雷咒盖侬
  - 返回格鲁德小镇向璐菊报告，获得乌尔波扎的愤怒
