desc: 游戏开场任务。林克从复苏神庙苏醒后，循着神秘女声的指引前往希卡之石地图上标记的地点——埋在地下的初始台地之塔，将希卡之石插入底座以激活高塔。
note: 刚出复苏神庙时手上只有树枝和破衣服，别在初始台地深处乱跑；按希卡之石地图标记直奔台地之塔开图，爬墙时注意体力条别透支。
reward: 解锁希卡之石地图（初始台地之塔升起，全图希卡之塔同步激活）
steps:
- 在复苏神庙取得希卡之石，穿上防寒服离开神庙
- 按地图标记前往初始台地之塔旧址
- 将希卡之石插入塔底座，激活初始台地之塔，解锁地图
