desc: 格鲁德小镇禁止男性入内，林克在镇门口被卫兵拦下。与在门口蹲点调查的商人本嘉对话后得知：卡拉卡拉集市上有位「女装大佬」能搞到格鲁德服装。花 600 卢比买到女装后即可混入小镇。
note: 直接硬闯格鲁德镇门口会被卫兵扔出来；必须先去卡拉卡拉集市旅馆屋顶找维利亚，花 600 卢比买全套格鲁德女装再换装进门，女装同时提供耐热效果。
reward: 格鲁德套装（花费 600 卢比从维利亚处购买）
steps:
- 在格鲁德小镇门口与本嘉对话，接取任务
- 前往卡拉卡拉集市，向商贩打听可疑男性商人
- 在集市旅馆屋顶找到维利亚，花 600 卢比买下格鲁德服装
- 换上女装通过卫兵盘查，进入格鲁德小镇
