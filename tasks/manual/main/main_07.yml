desc: 修复相机后，英帕认出希卡之石相册里是塞尔达一百年前拍的照片，指引林克去照片所示地点找回记忆。至少找回一段记忆后，英帕会把保管的英杰服交给林克；集齐全部十三段记忆后任务真正完结。
note: 只要找回任意一段记忆，回村找英帕就能拿到英杰服（穿上能显示怪物血条），不用急着找全；但真结局需要集齐全部 13 段记忆，最后一段要听完英帕提示才会在相册里出现。
reward: 英杰服（Champion's Tunic）
steps:
- 按希卡之石相册中的照片，前往对应地点触发记忆
- 至少找回一段记忆后回卡卡利科村找英帕
- 英帕交付英杰服
- 集齐相册十二段记忆后，英帕揭示最后一张照片位置，找回最终记忆
