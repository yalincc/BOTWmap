desc: 帮卓拉族镇压发狂的水之神兽瓦·露塔。先收集电箭、取得攀瀑用的卓拉铠甲，
  再与希多汇合启动神兽，进入体内击败水咒盖侬，继承米法的祝福。
note: |
  1. 去卓拉领地找希多王子接取；路上多备电箭。
  2. 雷兽山收集 20 支电箭——穿橡胶套装防雷，别硬吃雷击。
  3. 攀瀑需要卓拉铠甲，先找多莱凡国王拿。
  4. 东部蓄水湖与希多汇合，用电箭输送电力启动神兽。
  5. 神兽体内 5 个控制机构按序解锁，最后打水咒盖侬。
reward: 米法的祝福（英杰技能·自动回血）
steps:
  - 在卓拉领地门口与希多对话，接取讨伐神兽的任务
  - 与慕兹力对话，得知去雷兽山收集电箭的线索
  - 向多莱凡国王领取卓拉铠甲（解锁攀瀑）
  - 攀瀑上雷兽山，收集 20 支电箭
  - 在东部蓄水湖与希多汇合，用电箭启动神兽
  - 进入神兽体内，依次解锁 5 个控制机构
  - 击败水咒盖侬，镇压神兽瓦·露塔
  - 返回卓拉领地向多莱凡国王报告，获得米法的祝福
