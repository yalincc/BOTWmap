desc: 在帕戈斯树林听卡西唱歌，"森林巨龙之颚"指达梅尔森林的龙头废墟。到勇气之泉祈祷，射取金色飞龙费罗的鳞片丢入泉水，开启神庙。
note: 要射金色飞龙费罗取得鳞片，再丢进龙头废墟里的勇气之泉；龙会在德拉科祖湖上空盘旋。
reward: 获得费罗鳞片，开启希·库乔夫神庙
steps:
- 在帕戈斯树林与卡西对话接取
- 到达梅尔森林德拉科祖湖的龙头废墟（勇气之泉）
- 射一箭金色飞龙费罗取得鳞片
- 把费罗鳞片丢入勇气之泉，开启希·库乔夫神庙
