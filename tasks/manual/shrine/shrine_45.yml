desc: 在罗卓高原听到僧侣声音。雷暴中找回四颗不同颜色的宝珠，按石柱图示放到对应方位的盆中，开启神庙。
note: 四颗宝珠按石柱图示放位（紫北、红东、绿南、橙西）；高原雷暴不断，别拿金属装备乱走引雷。
reward: 开启托·雅萨神庙
steps:
- 进入罗卓高原触发僧侣声音
- 在高原四周找回紫、绿、红、橙四颗宝珠（用静止器打落）
- 按石柱图示把紫放北、红放东、绿放南、橙放西的盆中
- 四颗就位后开启托·雅萨神庙
