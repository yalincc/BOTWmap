desc: 在哈特诺村染料店后码头与克拉维娅对话，按"三杉树合一、转身朝海"提示，到蓝纳山顶三杉树一线位置朝海找被岩石封住的洞口，炸开开启神庙。
note: 要让三座山顶杉树在一条视线上对齐，再转身朝海方向找洞口；洞口被碎石封住，用遥控炸弹或炸弹箭炸开。
reward: 开启塔诺·阿神庙
steps:
- 在哈特诺村染料店后码头与克拉维娅对话接取
- 爬到蓝纳山山顶，让三个山头杉树连成一线
- 转身朝海方向，找到被碎石封住的山洞
- 用遥控炸弹/炸弹箭炸开岩石，进入塔诺·阿神庙
