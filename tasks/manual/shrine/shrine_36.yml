desc: 在格鲁德东部荒野，波基倒在神庙前想喝"贵族追求"。回贵族咖啡馆找芙罗萨，再到镇北冰屋白天取冰赶回交给她做冰饮，回去告知波基即可进神庙。
note: 从镇北冰屋取的冰在沙漠高温下会融化，拿到后尽快赶回交给芙罗萨做冰饮，别绕路耽搁。
reward: 救活波基，开启密·苏神庙
steps:
- 在东部荒野波基倒地处对话接取
- 回格鲁德镇贵族咖啡馆找芙罗萨，得知缺冰
- 白天到镇北冰屋找安洁取冰，赶在融化前运回交给芙罗萨
- 回去告诉波基冰饮已备好，波基离开后进入密·苏神庙
