desc: 在哈特诺村与梅达对话，得知蓝纳山顶的智慧之泉。到山顶解放被瘴气侵蚀的那德鲁，射下它的鳞片丢入泉水，开启神庙。
note: 先射附着在那德鲁身上的发光瘴气眼球，乘它制造的上升气流飞上去继续射；拿到鳞片后必须丢进泉水才算完成。
reward: 净化那德鲁并获得其鳞片，开启吉塔·萨米神庙
steps:
- 在哈特诺村与梅达对话，得知蓝纳山顶智慧之泉
- 到山顶女神像前，射击附着在龙身上的瘴气眼球，乘上升气流追击
- 全部清除后射一箭让那德鲁掉落鳞片
- 将那德鲁鳞片丢入智慧之泉水中，开启吉塔·萨米神庙
