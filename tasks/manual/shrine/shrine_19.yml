desc: 在帕尔玛遗迹与加里尼对话（需先解锁相机符文），他请你拍回散落各地、夜里会发光的石碑碎片照片，集齐后开启神庙。
note: 三块石碑碎片白天难辨，夜里碎片上的文字会发光，建议夜间按发光点寻找；需先解锁相机符文才能接。
reward: 开启玛·卡亚神庙
