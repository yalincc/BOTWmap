desc: 走到事件岛，被僧侣夺走全部装备。在岛上靠搜刮物资找到三颗古代之球分别放入三个祭坛，全部就位后开启神庙并归还装备。
note: 登岛后装备全被收走且不能用传送点，要就地捡武器打怪；中途离开岛则试炼重打，三颗球要重找。
reward: 夺回全部装备，开启库古·齐德神庙
steps:
- 登上事件岛触发僧侣试炼，装备被收走
- 在岛北部怪物营地取得第一颗球并放入附近祭坛
- 击败中部丛林的蓝色西诺克斯取得第二颗球，放入岩柱祭坛
- 在科利特岩怪物营地取得第三颗球，用静止器移开大石板放入祭坛；开启库古·齐德神庙
