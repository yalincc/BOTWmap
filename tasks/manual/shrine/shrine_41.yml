desc: 在克洛格森林西南边与祖奇对话，开始克洛格试炼。沿嘴里含铁块的食人树指引穿越迷雾迷失森林，完成喂食生锈盾牌等谜题，找到神庙。
note: 迷雾里会迷路，开磁力感知跟着嘴里含铁块的食人树指引走；途中有丘丘和岩石丘丘怪，可绕开。
reward: 开启库恩·希达吉神庙
steps:
- 在克洛格森林西南与祖奇对话接取
- 用磁力感知，跟随嘴里含铁块的食人树指引穿越迷雾
- 把守卫的生锈盾牌喂给食人树，按两树谜题往返
- 到达森林深处，开启库恩·希达吉神庙
