desc: 在西海拉鲁平原吉德桥端听卡西唱歌，谜底是一箭穿过两个石环。找到两处对准的环形岩石，站进其一内向另一石环射一箭即可开启神庙。
note: 两处石环要在一条直线上，站进其中一个环内用长弓一箭同时穿过两个环，射偏或分两箭都不算。
reward: 开启希·达哥兹神庙
steps:
- 在西海拉鲁平原吉德桥端与卡西对话接取
- 寻找两处位置对准的环形岩石
- 站进一个石环内，用长弓一箭同时穿过两个石环
- 开启希·达哥兹神庙
