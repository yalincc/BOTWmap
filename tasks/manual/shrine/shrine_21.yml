desc: 在纳波如山顶，鼓隆三兄弟发起耐热耐力比赛。站上灼热圆环撑到三兄弟全部倒下，再通过更烫的第二轮，即可开启神庙。
note: 第二轮灼热圆环会持续灼烧掉血，务必提前喝防火药水或一路吃回血料理，空血硬扛撑不到结束。
reward: 开启究尼·希神庙
steps:
- 在纳波如山与鼓隆三兄弟对话接取耐热比赛
- 站上第一轮灼热圆环，靠耐热料理/药物撑到三兄弟中暑倒下
- 再站上更烫的第二轮圆环（防火药水或持续回血）撑完全程
- 获胜后开启究尼·希神庙
