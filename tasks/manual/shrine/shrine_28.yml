desc: 解放水神兽后，在卓拉领地米法雕像前听拉鲁塔唱庆典之歌。找回掉落桥下的祭祀三叉戟，从水帘瀑布顶跳下刺中水潭中的祭坛，开启神庙。
note: 祭祀三叉戟掉在西边桥下水里，先用制冰术走到水面上，再用磁力把它吸上来；带齐后从水帘瀑布顶跳下刺祭坛。
reward: 寻回祭祀三叉戟，开启达·基基神庙
steps:
- 解放水神兽瓦·露塔后，在卓拉领地与拉鲁塔对话接取
- 找特雷洛问明祭祀三叉戟掉在西边桥下
- 用制冰术走到水上，再用磁力吸出三叉戟
- 从水帘瀑布顶跳下，用三叉戟刺中水潭中祭坛，开启达·基基神庙
