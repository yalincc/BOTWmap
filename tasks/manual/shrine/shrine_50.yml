- 到驿站西边的力量之泉女神像前祈祷
- 到奥尔汀侧翼/塔纳加峡谷射红色龙奥尔迪拉取得鳞片
- 把奥尔迪拉鳞片丢入力量之泉，开启茨茨阿·尼玛神庙
